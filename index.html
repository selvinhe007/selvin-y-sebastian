
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick Zone | Tu Estilo, Tu Juego</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">KICK <span>ZONE</span></div>
            
            <!-- Botón Hamburguesa -->
            <button class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <ul class="nav-menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="registros.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>DOMINA EL TERRENO Y LA CALLE</h1>
            <p>La mejor selección de calzado deportivo y casual.</p>
            
            <div class="cta-box">
                <a href="productos.html" class="btn-main">¡COMPRAR AHORA!</a>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Kick Zone - Estilo sin límites.</p>
    </footer>

    <!-- Script de JavaScript directamente en el HTML para que sea más fácil -->
    <script>
        const menu = document.querySelector('#mobile-menu');
        const menuLinks = document.querySelector('.nav-menu');

        menu.addEventListener('click', function() {
            menu.classList.toggle('is-active'); // Anima el botón
            menuLinks.classList.toggle('active'); // Muestra el menú
        });
    </script>
</body>
</html>
